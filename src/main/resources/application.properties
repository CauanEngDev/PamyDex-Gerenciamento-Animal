spring.application.name=PamyDex

#Ativa a interface web do H2
spring.h2.console.enable=true

#Url do console
spring.h2.console.path=/h2-console

#Define o banco, mem -> banco em memoria
spring.datasource.url=jdbc:h2:mem:pamydex

#Imprime o sql executado no terminal (bom pra debug)
spring.jpa.show-sql=true

#Define oq fazer com as tabelas ao iniciar/parar (create-drop = criar/apaga)
spring.jpa.hibernate.ddl-auto=create-drop

spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver